l_russian:
 LOADING_TIP_0: "«Мы Красноярском привыкли гордиться, Богатыря — Енисея сыны. Суриков наш только здесь мог родиться, В центре России — великой страны».\n- Из гимна Красноярска"
 LOADING_TIP_1: "«Последним смеется тот, кто стреляет первым».\n- Александр Лебедь"
 LOADING_TIP_2: "«Вражда Красноярска и Новосибирска заложена на генетическом уровне».\n-Авторское ."
 LOADING_TIP_3: "«В беде, в одиночестве люди все одинаковы».\n- Виктор Астафьев"
 LOADING_TIP_4: "«Лучше пить воду в радости, чем вино в кручине».\n- Виктор Астафьев"
 LOADING_TIP_5: "«Прежде чем пообещать — подумай, а пообещав — сделай обязательно».\n- Виктор Астафьев"
 LOADING_TIP_6: "Медведи — бессердечные создания."
 LOADING_TIP_7: "«Тайга, наша кормилица, хлипких не любит!».\n- Виктор Астафьев"
 LOADING_TIP_8: "«Счастье — это благодарность творцу абсолютно за всё в твоей судьбе: и за удачи, и за неудачи».\n- Юз Алешковский"
 LOADING_TIP_9: "«Наше чувство Времени — это же чувство движения всего существующего на Тот Свет!».\n- Юз Алешковский"
 LOADING_TIP_10: "«Я русский человек. Любое враждебное слово в отношении нашей культуры я воспринимаю в штыки»\n- Дмитрий Хворостовский"
 LOADING_TIP_11: "«Мне нравится одиночество. Наедине с самим собой я могу оставаться самим собой и заниматься тем, что мне действительно близко».\n- Дмитрий Хворостовский"
 LOADING_TIP_12: "Глупость — это не отсутствие ума, это такой ум.\n- Александр Лебедь"
 LOADING_TIP_13: "«Я устал от пустых обещаний, за которыми ничего нет».\n- Александр Лебедь"
 LOADING_TIP_14: "«Если виноватых нет, их назначают».\n- Александр Лебедь"
 LOADING_TIP_15: "«Нельзя просто так рассыпать асфальт и думать, что он будет потом много лет служить. Нужно технологию соблюдать».\n- Михаил Котюков"
 LOADING_TIP_16: "«Красноярск — красивый интеллигентный город... Не понимаю, почему здесь излюбленное место для ссылки».\n- Антон Чехов"
 LOADING_TIP_17: "«Больше всего забавляет, что из окна гостиницы виден тот самый мост, который изображен на «чирике».\n- Александр Ф."
 LOADING_TIP_17: "«Красноярск - оазис среди унылых сибирских городов. Чего стоит один краеведческий музей, построенный в египетском стиле».\n- Артемий Лебедев."
 LOADING_TIP_18: "«Чем бы солдат не занимался, лишь бы заебался».\n- Иван И."
 LOADING_TIP_19: "«Красноярская ГЭС - поразительное достижение советского народа- созидателя».\n- Ким Ир Сен."
 LOADING_TIP_19: "Проспект "Свободный" начинается с тюрьмы, а заканчивается кладбищем.\n-Факт ."
 LOADING_TIP_20: "Красноярск — единственный город в России, где «чёрное небо» — это не метеопрогноз, а режим работы...\n-Факт ."
 LOADING_TIP_21: "Красноярец смотрит прогноз погоды: «Так, завтра солнечно, +20... Значит, дым будет особенно густым и красивым».\n-Факт ."
 LOADING_TIP_22: "«Красноярск — это географический центр России».\n-Владимир Путин ."
 LOADING_TIP_23: "«Здорово, что ваша встреча проходит именно здесь, в Красноярске».\n-Владимир Путин ."