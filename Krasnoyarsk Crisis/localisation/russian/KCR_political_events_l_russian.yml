l_russian:
 KCR.10.t:0 "Кризис двух кабинетов"
 KCR.10.d:0 "Противостояние мэрии и губернатора достигло предела. Теперь каждый должен решить, какую сторону поддержать."
 KCR.10.a:0 "Поддержать мэрию"
 KCR.11.t:0 "День выборов: победитель партийной борьбы"
 KCR.11.desc:0 "14 сентября 2014 года борьба четырёх партий завершена. Накопленные решения определили победителя."
 KCR.11.a:0 "Победила губернаторская партия"
 KCR.11.b:0 "Победили националисты"
 KCR.11.c:0 "Победили «Справедливые решения»"
 KCR.11.d:0 "Победил пролетариат"
 KCR.12.t:0 "Кому принадлежит власть?"
 KCR.12.desc:0 "Победа партии определена. Теперь решается второй вопрос: кто получит реальную власть в Центральном районе — мэрия или губернатор?"
 KCR.12.a:0 "Мэрия получает власть"
 KCR.12.b:0 "Губернатор получает власть"
