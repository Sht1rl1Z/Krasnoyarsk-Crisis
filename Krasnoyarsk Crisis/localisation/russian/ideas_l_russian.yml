 KCR_political_tension_low:0 "Политическая напряжённость"
 KCR_political_tension_low_desc:0 "Разногласия между мэрией и краевой администрацией пока остаются управляемыми."

 KCR_political_tension_medium:0 "Растущая напряжённость"
 KCR_political_tension_medium_desc:0 "Противостояние кабинетов всё сильнее мешает нормальной работе Центрального района."

 KCR_political_tension_high:0 "Острый конфликт кабинетов"
 KCR_political_tension_high_desc:0 "Мэрия и краевая администрация практически открыто противостоят друг другу."

 KCR_administrative_chaos_1:0 "Административный хаос"
 KCR_administrative_chaos_1_desc:0 "Раздробленность управления и отсутствие единого центра принятия решений мешают нормальной работе Центрального района."

 KCR_administrative_chaos_2:0 "Административный хаос"
 KCR_administrative_chaos_2_desc:0 "Противостояние между различными органами власти усилилось. Административные решения принимаются медленнее, а ресурсы расходуются менее эффективно."

 KCR_administrative_legacy:0 "Административное наследие"
 KCR_administrative_legacy_desc:0 "Старая система управления оставила после себя сильный административный аппарат, который до сих пор определяет жизнь города."

 KCR_order_is_above_all_else:0 "Порядок превыше всего"
 KCR_order_is_above_all_else_desc:0 "После распада единой администрации город погрузился в хаос. Теперь восстановление порядка стало главной задачей власти."

 KCR_a_land_for_its_own_people:0 "Край для своих"
 KCR_a_land_for_its_own_people_desc:0 "Красноярский край должен сам определять своё будущее. Чужие интересы не должны стоять выше интересов его жителей."

 KCR_shared_house:0 "Общий дом"
 KCR_shared_house_desc:0 "Несмотря на старые разногласия, все районы остаются частью одного города. Их будущее невозможно построить поодиночке."

 KCR_siberian_socialism:0 "Сибирский социализм"
 KCR_siberian_socialism_desc:0 "Промышленность и рабочие вновь становятся основой Красноярска. Новый порядок строится на принципах коллективного труда и равенства."

 KCR_economic_base_1:0 "Экономическая база"
 KCR_economic_base_1_desc:0 "Центральный район обладает слабой собственной экономической базой и вынужден тратить значительные ресурсы на поддержание своей деятельности."

 KCR_economic_base_2:0 "Экономическая база"
 KCR_economic_base_2_desc:0 "Зависимость от внешних поставок и соседних районов сохраняется, однако экономические связи позволяют частично компенсировать нехватку собственных ресурсов."

 KCR_economic_base_3:0 "Экономическая база"
 KCR_economic_base_3_desc:0 "Экономическое положение района постепенно улучшается. Торговля и развитие инфраструктуры начинают формировать более устойчивую основу для дальнейшего роста."

 KCR_economic_base_4:0 "Экономическая стабильность"
 KCR_economic_base_4_desc:0 "Центральный район сформировал устойчивую экономическую основу. Развитая инфраструктур

 KCR_economic_small_business:0 "Малый бизнес"
 KCR_economic_small_business_desc:0 "Небольшие предприятия всё ещё пытаются удержаться на плаву после распада единой администрации. Их поддержка помогает сохранить рабочие места, но ограничивает возможности для масштабного строительства."

 KCR_economic_large_business:0 "Крупный бизнес"
 KCR_economic_large_business_desc:0 "Крупные предприятия обладают ресурсами для поддержания экономики города, однако их интересы всё чаще вступают в противоречие с государственными планами. Сосредоточение производства в руках нескольких компаний имеет свою цену."

