KCR_negotiations_with_the_sovetsky_district:0 "Переговоры с Советским районом"
KCR_negotiations_with_the_sovetsky_district_desc:0 "Провести переговоры с представителями Советского района. Успешные переговоры улучшат отношения с соседями на §G+10§!."

KCR_negotiations_with_the_october_district:0 "Переговоры с Октябрьским районом"
KCR_negotiations_with_the_october_district_desc:0 "Провести переговоры с представителями Октябрьского района. Успешные переговоры улучшат отношения с соседями на §G+10§!."

KCR_negotiations_with_the_railway_district:0 "Переговоры с Железнодорожным районом"
KCR_negotiations_with_the_railway_district_desc:0 "Провести переговоры с представителями Железнодорожного района. Успешные переговоры улучшат отношения с соседями на §G+10§!."

KCR_promote_complany:0 "Рекламная компания"
KCR_promote_complany_desc:0 "Закупка рекламы в других чатях красноярска поможет нашему государству развиваться быстрее и проще."

KCR_coruption_in_the_enemy_country:0 "Попросить помощи у разведки"
KCR_coruption_in_the_enemy_country_desc:0 "Наш ГУР поможет нам не только в политике и военном деле, но и в торговле. Наша цель - обоготить наш район, надо достигнуть её любыми целями"

KCR_sovetsky_bonus_value:0 "[?KCR_sovetsky_pp_bonus|2]"
KCR_october_bonus_value:0 "[?KCR_october_stability_bonus|2]"
KCR_railway_bonus_value:0 "[?KCR_railway_consumer_goods_bonus|2]"

KCR_party_struggle_category:0 "БОРЬБА ПАРТИЙ"

KCR_party_struggle_intro:0 "Выборы губернатора Центрального района — это не просто строчка в бюллетене. Раньше эта формулировка звучала по-другому, но сейчас мы играем теми картами, что есть на руках. И ставки высоки: от того, кто займет кресло, зависит всё — от нового состава кабинета министров до того, каким мы увидим наш район завтра. Это голосование за наше будущее."
KCR_party_edro_label:0 "Политическая партия §CЕдиный Центр:§!"
KCR_party_ldpc_label:0 "Политическая партия  §8ЛДПЦ:§!"
KCR_party_sr_label:0 "Политическая партия §YСправедливый центр:§!"
KCR_party_kpc_label:0 "Политическая партия §RКПЦ:§!"

KCR_support_governor_party:0 "Поддержать губернаторскую партию"
KCR_support_governor_party_desc:0 "Оказать политическую поддержку партии, связанной с краевой администрацией.\n\n§YЭффект:§!\n£GFX_ideology_KCR_regionalism_group  Влияние губернаторской партии: §G+10§!\n§R+3§! напряжённости кабинетов\n\n§YСтоимость:§! 25 политической власти\n§YПерезарядка:§! 14 дней"

KCR_support_nationalists:0 "Поддержать националистов"
KCR_support_nationalists_desc:0 "Укрепить позиции националистического движения в политической борьбе.\n\n§YЭффект:§!\n£GFX_ideology_KCR_national_populism_group  Влияние националистов: §G+3%§!\n§YПерезарядка:§! 14 дней"

KCR_support_justice_party:0 "Поддержать «Справедливые решения»"
KCR_support_justice_party_desc:0 "Оказать поддержку умеренной партии, выступающей за проведение последовательных политических реформ.\n\n§YЭффект:§!\n£GFX_ideology_KCR_social_reformism_group  Влияние «Справедливых решений»: §G+10§!\n§R+3§! напряжённости кабинетов\n\n§YСтоимость:§! 25 политической власти\n§YПерезарядка:§! 14 дней"

KCR_support_proletariat:0 "Поддержать пролетариат"
KCR_support_proletariat_desc:0 "Укрепить позиции пролетарского движения и его влияние на политическую жизнь Центрального района.\n\n§YЭффект:§!\n£GFX_ideology_KCR_soviet_socialism_group  Влияние пролетариата: §G+10§!\n§R+3§! напряжённости кабинетов\n\n§YСтоимость:§! 25 политической власти\n§YПерезарядка:§! 14 дней"

KCR_voting_day:0 "День голосования"
KCR_voting_day_desc:0 "Пришло время подвести итоги политической борьбы. Четыре партии потратили месяцы на агитацию, интриги и аппаратные игры. Теперь всё решится в один день. Как только бюллетени будут подсчитаны, станет ясно, кто возглавит Центральный район, а кто останется у разбитого корыта."

KCR_the_opponent_makes_a_moven:0 "Противник совершает ход"
KCR_the_opponent_makes_a_moven_desc:0 "Политические противники не дремлют. Пока мы тратим время на согласования, они плетут интриги, переманивают сторонников и готовят почву для удара. Их очередная выходка может качнуть чаши весов в любую сторону. Нужно быть готовыми к неожиданностям."

