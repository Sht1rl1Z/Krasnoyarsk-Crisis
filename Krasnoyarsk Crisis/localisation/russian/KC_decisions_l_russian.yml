l_russian:

KCR_cabinet_conflict_category:0 "БОРЬБА КАБИНЕТОВ"
KCR_cabinet_conflict_category_desc:0 "Влияние мэрии: Мэрия и краевая администрация продолжают борьбу за контроль над Центральным районом."

KCR_reduce_tension:0 "Снижение напряжённости"
KCR_reduce_tension_desc:0 "Напряжённость между мэрией и краевой администрацией постепенно снижается сама по себе. Если противостояние не будет дополнительно обостряться, стороны будут постепенно отходить от открытого конфликта.\n\n§YЭффект:§!\n§G-2§! напряжённости кабинетов каждый месяц.\n\n§YСтатус:§! Постоянное действие до завершения фокуса §Y«Новый порядок»§!."

KCR_support_mayor:0 "Поддержать мэрию"
KCR_support_mayor_desc:0 "Оказать политическую поддержку городской администрации. Это усилит влияние мэрии, одновременно ослабив позиции краевой администрации, но повысит напряжённость между двумя кабинетами.\n\n§YЭффект:§!\n§G+8§! влияния мэрии\n§G-3§! влияния губернатора\n§R+5§! напряжённости кабинетов."

KCR_support_governor:0 "Поддержать губернатора"
KCR_support_governor_desc:0 "Оказать политическую поддержку краевой администрации. Это усилит влияние губернатора, одновременно ослабив позиции городской администрации, но повысит напряжённость между двумя кабинетами.\n\n§YЭффект:§!\n§G+8§! влияния губернатора\n§G-3§! влияния мэрии\n§R+5§! напряжённости кабинетов."

KCR_conciliation_meeting:0 "Примирительная встреча"
KCR_conciliation_meeting_desc:0 "Собрать представителей двух кабинетов за закрытым столом переговоров. Встреча снижает напряжённость, однако её результат может оказаться непредсказуемым.\n\n§YЭффект:§!\n§G-15§! напряжённости кабинетов\n§G+2%§! стабильности\n\nСлучайный результат может изменить влияние мэрии и губернатора."

KCR_pressure_city_officials:0 "Давление на городских чиновников"
KCR_pressure_city_officials_desc:0 "Использовать административные рычаги для укрепления позиций мэрии. Такой шаг позволит увеличить её влияние, но усилит напряжённость между кабинетами.\n\n§YЭффект:§!\n§G+12§! влияния мэрии\n§R+8§! напряжённости кабинетов\n§R-1%§! стабильности\n\n§YПерезарядка:§! 90 дней."

KCR_regional_commission:0 "Краевая комиссия"
KCR_regional_commission_desc:0 "Создать специальную комиссию для усиления влияния краевой администрации в делах Центрального района. Это укрепит позиции губернатора, но увеличит напряжённость.\n\n§YЭффект:§!\n§G+12§! влияния губернатора\n§R+8§! напряжённости кабинетов\n§R-1%§! стабильности\n\n§YПерезарядка:§! 90 дней."

KCR_closed_meeting:0 "Закрытое совещание"
KCR_closed_meeting_desc:0 "Провести тайные переговоры между представителями мэрии и краевой администрации. Стороны могут попытаться найти компромисс или воспользоваться встречей для укрепления собственных позиций.\n\n§YЭффект:§!\n§G-10§! напряжённости кабинетов\n\nРезультат переговоров определяется случайным образом.\n\n§YПерезарядка:§! 120 дней."

KCR_unified_budget:0 "Единый бюджет"
KCR_unified_budget_desc:0 "Попытаться согласовать единый бюджет города и края. Для этого необходимо, чтобы обе стороны обладали значительным влиянием, а напряжённость оставалась относительно низкой.\n\n§YЭффект:§!\n§G-20§! напряжённости кабинетов\n§G+5%§! стабильности\n\nДаёт временный эффект §Y«Единый бюджет»§! на 180 дней.\n\n§YПерезарядка:§! 180 дней."

KCR_escalate_conflict:0 "Обострить конфликт"
KCR_escalate_conflict_desc:0 "Намеренно усилить противостояние между двумя кабинетами. Такой шаг резко увеличит напряжённость и может укрепить одну из сторон, но создаст дополнительную нестабильность.\n\n§YЭффект:§!\n§R+25§! напряжённости кабинетов\n§R-3%§! стабильности\n\n§YСлучайный эффект:§! одна из сторон получит §G+10§! влияния.\n\n§YПерезарядка:§! 120 дней."

KCR_strengthen_mayor:0 "Мэрия делает свой шаг"
KCR_strengthen_mayor_desc:0 "Краевой аппарат усиливает своё влияние в Центральном районе. Необходимо укрепить позиции городской администрации и вернуть ей инициативу.\n\n§YЭффект:§!\n§G+8§! влияния мэрии\n§R+2§! напряжённости кабинетов\n\n§YПерезарядка:§! 45 дней.\n\n§YСтатус:§! Постоянное действие до завершения фокуса §Y«Новый порядок»§!."

KCR_strengthen_governor:0 "Укрепить позиции губернатора"
KCR_strengthen_governor_desc:0 "Городская администрация постепенно расширяет своё влияние. Краевой власти необходимо укрепить свои позиции и не допустить потери контроля над районом.\n\n§YЭффект:§!\n§G+8§! влияния губернатора\n§R+2§! напряжённости кабинетов\n\n§YПерезарядка:§! 45 дней.\n\n§YСтатус:§! Постоянное действие до завершения фокуса §Y«Новый порядок»§!."

KCR_trading_category:0 "ОТНОШЕНИЯ С СОСЕДЯМИ"
KCR_trading_category_desc:0 "Центральный район вынужден поддерживать отношения с соседними районами. Сотрудничество укрепляет связи, тогда как давление и конфликты ведут к ухудшению отношений."

