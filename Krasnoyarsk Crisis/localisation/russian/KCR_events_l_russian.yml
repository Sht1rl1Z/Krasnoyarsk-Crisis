l_russian:

 kcr.1.t:0 "Начало политической борьбы"
 kcr.1.d:0 "Четыре политические силы начинают борьбу за влияние. В течение ближайших месяцев решения правительства будут определять расстановку сил."
 kcr.1.a:0 "Начать политическую борьбу"

 kcr.2.t:0 "§CЕдиный Центр§! празднует победу"
 kcr.2.d:0 "Народ Центрального района сделал свой выбор. «Единый Центр» сохраняет за собой губернаторское кресло, а значит, курс на стабильность и преемственность будет продолжен. Оппозиция разгромлена, но сумеет ли власть оправдать доверие? Впереди — формирование нового кабинета и решение накопившихся проблем."
 kcr.2.a:0 "Стабильность превыше всего!"

 kcr.3.t:0 "§8ЛДПЦ§! берет реванш"
 kcr.3.d:0 "Сенсация! «Либерально-Демократическая Партия Центра» одержала верх на выборах губернатора. Избиратели устали от серости и требуют перемен. Новый губернатор обещает жесткий порядок, борьбу с коррупцией и защиту национальных интересов. Как отреагирует старая элита на приход «ястребов»?"
 kcr.3.a:0 "Порядок будет восстановлен!"

 kcr.4.t:0 "§YСправедливый Центр§! у власти"
 kcr.4.d:0 "Голоса за «СР» принесли ей долгожданную победу. Теперь справедливость должна восторжествовать в каждом уголке Центрального района. Новый губернатор обещает социальные гарантии, поддержку незащищенных слоев населения и честное распределение бюджета. Смогут ли они удержать баланс между интересами элит и народа?"
 kcr.4.a:0 " Народ превыше всего!"

 kcr.5.t:0 "§RКПЦ§! объявляет о победе пролетариата"
 kcr.5.d:0 "Красное знамя поднято над зданием администрации. Коммунистическая партия Центра одержала победу на выборах. Рабочий класс взял власть в свои руки. Обещания о национализации, равенстве и братстве теперь должны стать реальностью. Но готова ли новая власть к сопротивлению старых хозяев жизни?"
 kcr.5.a:0 "Вся власть — народу!."

 kcr.6.t:0 "Мэрия берет верх над губернатором"
 kcr.6.d:0 "В затяжном противостоянии между городской администрацией и региональной властью победу одержал мэр. Его влияние оказалось решающим, а сторонники губернатора потерпели поражение. Теперь курс на развитие Центрального района будет определяться из мэрии, а не из губернаторского кабинета. Местные элиты празднуют успех, но смогут ли они удержать власть?"
 kcr.6.a:0 "Городская власть превыше всего!"

 kcr.7.t:0 "Губернатор подавляет сопротивление мэрии"
 kcr.7.d:0 "Губернатор Центрального района доказал, что вертикаль власти нерушима. Мэр и его сторонники вынуждены подчиниться воле регионального центра. Администрация губернатора берет под полный контроль все ключевые решения, касающиеся развития района. Централизация управления продолжается, но недовольство на местах может вылиться в новые конфликты в будущем."
 kcr.7.a:0 "Вертикаль власти восстановлена!"

 kcr.8.t:0 "Вопрос о будущем региона"
 kcr.8.d:0 "В условиях меняющейся политической обстановки руководство приняло решение опереться на идеи местного автономии и защиты интересов края. Регионалисты берут контроль над правительством."
 kcr.8.a:0 "Да здравствует наш край!"

 kcr.9.t:0 "Приход к власти национал-популистов"
 kcr.9.d:0 "Растущее недовольство и кризис позволили радикальным популистским силам возглавить движение. Власть переходит к сторонникам жесткой национальной политики."
 kcr.9.a:0 "Наступил новый порядок!"

 kcr.10.t:0 "Победа социал-реформистов"
 kcr.10.d:0 "Благодаря поддержке широких слоев населения и умеренной программе социальных преобразований правительство формируют реформисты."
 kcr.10.a:0 "Навстречу прогрессу и справедливости!"

 kcr.11.t:0 "Установление советской власти"
 kcr.11.d:0 "Левые силы и рабочие комитеты окончательно берет инициативу в свои руки. Власть переходит к представителям советского социализма."
 kcr.11.a:0 "Вся власть Советам!"

 kcr.12.t:0 "Два кабинета"
 kcr.12.d:0 "Текст ивента 2 кабинета"
 kcr.12.a:0 "Пу пу пу"

 kcr.13.t:0 "Как улучшить торговое влияние?"
 kcr.13.d:0 "Да, очень просто, просто девертесь нашей разведке. С кем желаете улучшить отношение?"
 kcr.13.a:0 "Советский район"
 kcr.13.b:0 "Октябрьский район"
 kcr.13.c:0 "Железнодорожный район"

 kcr.14.t:0 "Успех нашей компании"
 kcr.14.d:0 "Наша секретная миссия увенчалачь успехом, наши решительные действия помогли улучшить торговые отношения. Нам в будущем это опнадобится"
 kcr.14.a:0 "Спасибо за вашу работу"

 kcr.15.t:0 "Крах"
 kcr.15.d:0 "Агенты были обнаружены, но причастность нашего района им не удастся доказать. Удар стал неприятным, но не серьозным."
 kcr.15.a:0 "Пу пу пу"



 news.1.t:0 "§wТопливный кризис охватил Красноярск§!"
 news.1.d:0 "§bПеребои с поставками топлива привели к длинным очередям на заправках по всему Красноярску. Районные администрации обвиняют друг друга в перехвате грузов и искусственном создании дефицита. Грузоперевозки замедляются, предприятия сокращают смены, а цены на бензин стремительно растут. Пока политики спорят о виновных, жители города вынуждены часами стоять в очередях за последними литрами топлива.§!"
