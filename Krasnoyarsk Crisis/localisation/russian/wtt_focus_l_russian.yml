l_russian:
  KCR_centrbezcentra:0 "Центр без центра"
  KCR_centrbezcentra_desc:0 "Центральный район формально является сердцем города, но в последние годы это сердце перестало понимать, кто им управляет. Мэрия требует самостоятельности, администрация губернатора — подчинения."

  KCR_portyimasterskie:0 "Порты и мастерские"
  KCR_portyimasterskie_desc:0 "Старой инфраструктуры уже недостаточно. Енисей должен стать полноценной экономической артерией района."
  KCR_mestnomubiznesu:0 "Доверимся местному бизнесу"
  KCR_mestnomubiznesu_desc:0 "Лучше доверить Енисей тем, кто знает город и уже работает здесь."
  KCR_krupnomukapitalu:0 "Доверимся крупному капиталу"
  KCR_krupnomukapitalu_desc:0 "Большие проекты требуют больших денег. Крупные инвесторы готовы вложить необходимые средства, но за это потребуют значительного влияния."
  KCR_rasshirittorgovlyu:0 "Расширить торговлю"
  KCR_rasshirittorgovlyu_desc:0 "Мы не можем производить всё необходимое самостоятельно, зато можем стать местом, через которое проходят товары всего города."
  KCR_rayonbezzavodov:0 "Район без заводов"
  KCR_rayonbezzavodov_desc:0 "Когда-то промышленность определяла жизнь Красноярска, но основные предприятия остались за пределами Центра. Нам достались административные здания, торговые площади и развитая инфраструктура — но почти никакого производства."
  KCR_zavisimostotsosedey:0 "Зависимость от соседей"
  KCR_zavisimostotsosedey_desc:0 "Центр не располагает собственными запасами сырья. Машины, топливо, металл и большая часть продукции должны поступать с соседних территорий."
  KCR_eniseynashaarteriya:0 "Енисей — наша артерия"
  KCR_eniseynashaarteriya_desc:0 "Если у нас нет ресурсов под землёй, значит, их нужно доставлять по воде. Енисей способен превратить географический недостаток Центра в его главное экономическое преимущество."
  KCR_rechnoyuzel:0 "Речной узел"
  KCR_rechnoyuzel_desc:0 "Набережные и причалы должны работать не только для пассажиров и прогулок. Центру необходим настоящий торговый узел, связывающий районы Красноярска и территории вдоль Енисея."
  
  KCR_dvakabineta:0 "Два кабинета"
  KCR_dvakabineta_desc:0 "В одном здании принимаются решения города, в другом — решения края. Оба кабинета считают себя главными, и каждый старается перетянуть район на свою сторону."

  KCR_gubernator_demokrat:0 "Губернатор демократ"
  KCR_gubernator_demokrat_desc:0 "В противовес старой системе появляется новый проект управления Центром. Губернатор обещает вернуть решения из закрытых кабинетов в руки представителей города и прекратить бесконечную борьбу чиновничьих группировок. Вопрос лишь в том, сколько людей поверит этим обещаниям, когда вокруг уже гремят первые выстрелы."
  KCR_opora_centra:0 "Опора центра"
  KCR_opora_centra_desc:0 "Центральный район привык считать себя сердцем Красноярска, но сердце не может существовать без остального организма. Новый курс требует создать вокруг администрации собственную сеть поддержки — среди районов, предприятий и городских структур. Центр должен стать не просто местом расположения власти, а её настоящей опорой."

  KCR_nyneshniy_apparat:0 "Нынешний аппарат"
  KCR_nyneshniy_apparat_desc:0 "После распада единой администрации старые чиновники сумели сохранить за собой кабинеты, связи и влияние. Они прекрасно знают, как работает городская машина, и не собираются уступать её тем, кто пришёл им на смену. Пока другие спорят о будущем, нынешний аппарат продолжает управлять Центром так, будто ничего не изменилось."
  KCR_zakrepitsya_na_kresle:0 "Закрепиться на кресле"
  KCR_zakrepitsya_na_kresle_desc:0 "Война за власть редко начинается с выстрелов. Иногда достаточно не пустить соперника в кабинет, сохранить нужные подписи и вовремя напомнить старым союзникам о взаимных услугах. Если нынешний аппарат хочет пережить грядущий кризис, ему придётся превратить свои кресла в крепости."
  
  KCR_nacionalizm_nashe_vse:0 "Национализм наше всё"
  KCR_nacionalizm_nashe_vse_desc:0 "Пока чиновники спорят о полномочиях, всё больше жителей задаются другим вопросом: кому вообще принадлежит город? Ответ националистов прост — тем, кто готов его защищать. На улицах всё чаще звучат речи о едином городе, единой воле и необходимости поставить интересы Центра выше старых административных распрей."
  KCR_novyy_kurs:0 "Новый курс"
  KCR_novyy_kurs_desc:0 "Старый порядок расколол город на районы, администрации и вооружённые группировки. Новый курс предлагает отказаться от этой слабости и собрать Центральный район вокруг единой цели. Центр должен говорить от собственного имени. Он длжен объеденить город."

  KCR_spravedlivye_resheniya:0 "Справедливые решения"
  KCR_spravedlivye_resheniya_desc:0 "Центральный район не может бесконечно жить по правилам, которые меняются вместе с тем, кто сегодня занимает кабинет. Сторонники справедливых решений предлагают поставить во главу угла интересы обычных жителей и добиться того, чтобы власть отвечала перед теми, кем она управляет. В расколотом городе это обещание может оказаться куда сложнее исполнить, чем произнести."
  KCR_centr_dlya_vseh:0 "Центр для всех"
  KCR_centr_dlya_vseh_desc:0 "Центральный район слишком долго воспринимался как приз для победителя. Но если Центр действительно является сердцем города, его двери должны быть открыты для всех. Новая администрация намерена превратить район из крепости одной группировки в место, где пересекаются интересы всего Красноярска."

  KCR_vlast_proletariatu:0 "Власть пролетариату"
  KCR_vlast_proletariatu_desc:0 "За витринами Центрального района находятся те, кто каждый день поддерживает жизнь города своим трудом. Заводы Кировского района уже готовят броню, рабочие кварталы Ленинского района следят за происходящим, а в Центре всё ещё решают их судьбу за закрытыми дверями. Пора изменить этот порядок."
  KCR_krasnyy_rayon:0 "Красный район"
  KCR_krasnyy_rayon_desc:0 "Для нового порядка одного лозунга недостаточно. Центральный район должен стать примером того, как рабочая власть способна управлять городом в условиях войны. Кабинеты будут уступать место комитетам, а решения — приниматься не ради отдельных чиновников, а ради тех, кто держит город на своих плечах."

  KCR_novyyporyadok:0 "Новый порядок"
  KCR_novyyporyadok_desc:0 "Политический конфликт больше нельзя откладывать. Центр либо нашёл нового хозяина, либо научился жить с двумя центрами власти."
