l_russian:
  #base
  KCR_centrbezcentra:0 "Центр без центра"
  KCR_centrbezcentra_desc:0 "Центральный район формально является сердцем города, но в последние годы это сердце перестало понимать, кто им управляет. Мэрия требует самостоятельности, администрация губернатора — подчинения."
  KCR_portyimasterskie:0 "Порты и мастерские"
  KCR_portyimasterskie_desc:0 "Старой инфраструктуры уже недостаточно. Енисей должен стать полноценной экономической артерией района."
  KCR_mestnomubiznesu:0 "Доверимся местному бизнесу"
  KCR_mestnomubiznesu_desc:0 "Лучше доверить Енисей тем, кто знает город и уже работает здесь."
  KCR_krupnomukapitalu:0 "Доверимся крупному капиталу"
  KCR_krupnomukapitalu_desc:0 "Большие проекты требуют больших денег. Крупные инвесторы готовы вложить необходимые средства, но за это потребуют значительного влияния."
  KCR_rasshirittorgovlyu:0 "Расширить торговлю"
  KCR_rasshirittorgovlyu_desc:0 "Мы не можем производить всё необходимое самостоятельно, зато можем стать местом, через которое проходят товары всего города."
  KCR_rayonbezzavodov:0 "Район без заводов"
  KCR_rayonbezzavodov_desc:0 "Когда-то промышленность определяла жизнь Красноярска, но основные предприятия остались за пределами Центра. Нам достались административные здания, торговые площади и развитая инфраструктура — но почти никакого производства."
  KCR_zavisimostotsosedey:0 "Зависимость от соседей"
  KCR_zavisimostotsosedey_desc:0 "Центр не располагает собственными запасами сырья. Машины, топливо, металл и большая часть продукции должны поступать с соседних территорий."
  KCR_eniseynashaarteriya:0 "Енисей — наша артерия"
  KCR_eniseynashaarteriya_desc:0 "Если у нас нет ресурсов под землёй, значит, их нужно доставлять по воде. Енисей способен превратить географический недостаток Центра в его главное экономическое преимущество."
  KCR_rechnoyuzel:0 "Речной узел"
  KCR_rechnoyuzel_desc:0 "Набережные и причалы должны работать не только для пассажиров и прогулок. Центру необходим настоящий торговый узел, связывающий районы Красноярска и территории вдоль Енисея."
  KCR_dvakabineta:0 "Два кабинета"
  KCR_dvakabineta_desc:0 "В одном здании принимаются решения города, в другом — решения края. Оба кабинета считают себя главными, и каждый старается перетянуть район на свою сторону."
  KCR_gubernator_demokrat:0 "Губернатор демократ"
  KCR_gubernator_demokrat_desc:0 "В противовес старой системе появляется новый проект управления Центром. Губернатор обещает вернуть решения из закрытых кабинетов в руки представителей города и прекратить бесконечную борьбу чиновничьих группировок. Вопрос лишь в том, сколько людей поверит этим обещаниям, когда вокруг уже гремят первые выстрелы."
  KCR_opora_centra:0 "Опора центра"
  KCR_opora_centra_desc:0 "Центральный район привык считать себя сердцем Красноярска, но сердце не может существовать без остального организма. Новый курс требует создать вокруг администрации собственную сеть поддержки — среди районов, предприятий и городских структур. Центр должен стать не просто местом расположения власти, а её настоящей опорой."
  KCR_nyneshniy_apparat:0 "Нынешний аппарат"
  KCR_nyneshniy_apparat_desc:0 "После распада единой администрации старые чиновники сумели сохранить за собой кабинеты, связи и влияние. Они прекрасно знают, как работает городская машина, и не собираются уступать её тем, кто пришёл им на смену. Пока другие спорят о будущем, нынешний аппарат продолжает управлять Центром так, будто ничего не изменилось."
  KCR_zakrepitsya_na_kresle:0 "Закрепиться на кресле"
  KCR_zakrepitsya_na_kresle_desc:0 "Война за власть редко начинается с выстрелов. Иногда достаточно не пустить соперника в кабинет, сохранить нужные подписи и вовремя напомнить старым союзникам о взаимных услугах. Если нынешний аппарат хочет пережить грядущий кризис, ему придётся превратить свои кресла в крепости."
  KCR_nacionalizm_nashe_vse:0 "Национализм наше всё"
  KCR_nacionalizm_nashe_vse_desc:0 "Пока чиновники спорят о полномочиях, всё больше жителей задаются другим вопросом: кому вообще принадлежит город? Ответ националистов прост — тем, кто готов его защищать. На улицах всё чаще звучат речи о едином городе, единой воле и необходимости поставить интересы Центра выше старых административных распрей."
  KCR_novyy_kurs:0 "Новый курс"
  KCR_novyy_kurs_desc:0 "Старый порядок расколол город на районы, администрации и вооружённые группировки. Новый курс предлагает отказаться от этой слабости и собрать Центральный район вокруг единой цели. Центр должен говорить от собственного имени. Он длжен объеденить город."
  KCR_spravedlivye_resheniya:0 "Справедливые решения"
  KCR_spravedlivye_resheniya_desc:0 "Центральный район не может бесконечно жить по правилам, которые меняются вместе с тем, кто сегодня занимает кабинет. Сторонники справедливых решений предлагают поставить во главу угла интересы обычных жителей и добиться того, чтобы власть отвечала перед теми, кем она управляет. В расколотом городе это обещание может оказаться куда сложнее исполнить, чем произнести."
  KCR_centr_dlya_vseh:0 "Центр для всех"
  KCR_centr_dlya_vseh_desc:0 "Центральный район слишком долго воспринимался как приз для победителя. Но если Центр действительно является сердцем города, его двери должны быть открыты для всех. Новая администрация намерена превратить район из крепости одной группировки в место, где пересекаются интересы всего Красноярска."
  KCR_vlast_proletariatu:0 "Власть пролетариату"
  KCR_vlast_proletariatu_desc:0 "За витринами Центрального района находятся те, кто каждый день поддерживает жизнь города своим трудом. Заводы Кировского района уже готовят броню, рабочие кварталы Ленинского района следят за происходящим, а в Центре всё ещё решают их судьбу за закрытыми дверями. Пора изменить этот порядок."
  KCR_krasnyy_rayon:0 "Красный район"
  KCR_krasnyy_rayon_desc:0 "Для нового порядка одного лозунга недостаточно. Центральный район должен стать примером того, как рабочая власть способна управлять городом в условиях войны. Кабинеты будут уступать место комитетам, а решения — приниматься не ради отдельных чиновников, а ради тех, кто держит город на своих плечах."
  KCR_novyyporyadok:0 "Новый порядок"
  KCR_novyyporyadok_desc:0 "Политический конфликт больше нельзя откладывать. Центр либо нашёл нового хозяина, либо научился жить с двумя центрами власти."
  #EDCE_reg
  l_russian:
 KCR_edro_mandate:0 "Мандат на обновление"
 KCR_edro_mandate_desc:0 "Победа на выборах дала руководству Центра возможность перейти от экстренного управления к долгосрочной программе развития. Теперь предстоит закрепить доверие жителей и доказать, что новая власть способна действовать эффективно."

 KCR_edro_audit:0 "Ревизия государственных ресурсов"
 KCR_edro_audit_desc:0 "Прежде чем начинать масштабные преобразования, необходимо понять, чем располагает район. Проверка бюджета, имущества и кадров позволит выявить слабые места администрации."

 KCR_edro_public_council:0 "Совет общественного согласия"
 KCR_edro_public_council_desc:0 "Представители предприятий, муниципальных служб и общественных объединений получат площадку для обсуждения будущего Центра. Их участие поможет снизить напряжённость и придать решениям дополнительную легитимность."

 KCR_edro_political_choice:0 "Определить политический курс"
 KCR_edro_political_choice_desc:0 "Перед руководством стоят два пути: расширить участие местных сообществ или укрепить исполнительную вертикаль. Оба обещают управляемость, но приведут к разному устройству власти."

 KCR_edro_civic_path:0 "Опора на гражданское общество"
 KCR_edro_civic_path_desc:0 "Центр сделает ставку на общественные советы и участие жителей в принятии решений. Власть будет искать поддержку не только в кабинетах, но и на улицах района."

 KCR_edro_vertical_path:0 "Укрепление исполнительной вертикали"
 KCR_edro_vertical_path_desc:0 "Губернаторская администрация сосредоточит полномочия в едином центре принятия решений. В условиях нестабильности скорость и дисциплина становятся важнее долгих согласований."

 KCR_edro_neighborhood_councils:0 "Советы микрорайонов"
 KCR_edro_neighborhood_councils_desc:0 "Местные советы смогут передавать администрации проблемы жителей и контролировать исполнение решений. Это позволит лучше учитывать ситуацию в каждом квартале."

 KCR_edro_public_budget:0 "Открытый муниципальный бюджет"
 KCR_edro_public_budget_desc:0 "Публикация расходов и обсуждение приоритетов сделают распределение средств понятнее. Жители увидят, на что направляются ограниченные ресурсы Центра."

 KCR_edro_civic_compact:0 "Общественный договор"
 KCR_edro_civic_compact_desc:0 "Администрация и представители гражданского общества согласуют общие правила сотрудничества. Взамен поддержки власть обязуется учитывать интересы жителей и отчитываться о результатах."

 KCR_edro_executive_committee:0 "Исполнительный комитет"
 KCR_edro_executive_committee_desc:0 "Новый комитет объединит ключевые ведомства и обеспечит согласованность их действий. Решения губернатора будут быстрее превращаться в конкретные распоряжения."

 KCR_edro_administrative_discipline:0 "Административная дисциплина"
 KCR_edro_administrative_discipline_desc:0 "Единые регламенты, персональная ответственность и регулярные проверки должны прекратить ведомственную неразбериху. Чиновники будут отвечать за выполнение поставленных задач."

 KCR_edro_regional_contacts:0 "Единая сеть районных представителей"
 KCR_edro_regional_contacts_desc:0 "Уполномоченные администрации наладят постоянную связь с предприятиями и местными руководителями. Это позволит центру власти получать информацию и оперативно реагировать на кризисы."

 KCR_edro_common_agenda:0 "Общая программа Центра"
 KCR_edro_common_agenda_desc:0 "Сторонники обеих моделей управления признают необходимость общей программы развития. Политические разногласия временно отойдут на второй план перед задачей укрепления района."

 KCR_edro_legal_commission:0 "Комиссия по правовому устройству"
 KCR_edro_legal_commission_desc:0 "Юристы подготовят нормативную основу для работы новых органов власти. Чёткое разграничение полномочий позволит избежать конфликтов между ведомствами."

 KCR_edro_security_council:0 "Совет безопасности Центра"
 KCR_edro_security_council_desc:0 "Руководители силовых структур и администрации начнут регулярно координировать действия. Совет займётся оценкой угроз и защитой стратегически важных объектов."

 KCR_edro_neighbor_policy:0 "Политика в отношении соседей"
 KCR_edro_neighbor_policy_desc:0 "Центру необходимо определить отношения с другими районами распавшегося Красноярска. Переговоры могут принести выгоду, но не исключено и дальнейшее обострение."

 KCR_edro_soviet_dossier:0 "Досье на Советский район"
 KCR_edro_soviet_dossier_desc:0 "Сбор сведений о политическом руководстве, ресурсах и вооружённых силах Советского района позволит оценить его намерения и возможности."

 KCR_edro_ultimatum:0 "Последнее предупреждение"
 KCR_edro_ultimatum_desc:0 "Центр предъявит Советскому району требования, касающиеся безопасности и влияния в городе. Отказ выполнить их будет расценён как прямой вызов."

 KCR_edro_mobilize_authority:0 "Полномочия военного времени"
 KCR_edro_mobilize_authority_desc:0 "Администрация получит возможность быстро координировать гражданские службы и силовые структуры. Район должен быть готов к чрезвычайному развитию событий."

 KCR_edro_march_on_soviet:0 "Установить контроль над Советским районом"
 KCR_edro_march_on_soviet_desc:0 "Дипломатические возможности исчерпаны. Руководство Центра отдаёт приказ начать наступление и силой изменить расстановку сил в Красноярске."

 KCR_edro_econ_recovery:0 "Программа экономического восстановления"
 KCR_edro_econ_recovery_desc:0 "После стабилизации политической ситуации Центр может перейти к восстановлению хозяйства. Первой задачей станет запуск предприятий и восстановление привычных экономических связей."

 KCR_edro_resource_inventory:0 "Учёт ресурсов и производств"
 KCR_edro_resource_inventory_desc:0 "Администрация составит перечень доступных предприятий, складов, транспорта и сырья. Полная картина ресурсов позволит выбрать наиболее реалистичную модель развития."

 KCR_edro_critical_supply:0 "Обеспечение критических поставок"
 KCR_edro_critical_supply_desc:0 "Бесперебойное снабжение топливом, продовольствием и промышленными материалами необходимо для работы района. Создание резервов снизит зависимость от случайных поставок."

 KCR_edro_economic_choice:0 "Выбор экономической модели"
 KCR_edro_economic_choice_desc:0 "Центру предстоит выбрать между сохранением сложившегося курса, государственным планированием и развитием торговли. Каждый вариант по-своему отвечает на вызовы изоляции и нехватки ресурсов."

 KCR_edro_track_1:0 "Сохранить действующие связи"
 KCR_edro_track_1_desc:0 "Центр не станет ломать сложившуюся экономическую систему. Сохранение существующих связей позволит избежать потрясений в переходный период."

 KCR_edro_track_2:0 "Поддержать старые предприятия"
 KCR_edro_track_2_desc:0 "Предприятия, пережившие распад прежней системы, получат поддержку и доступ к ограниченным ресурсам. Их восстановление станет основой постепенного роста."

 KCR_edro_track_3:0 "Восстановить производственные цепочки"
 KCR_edro_track_3_desc:0 "Возобновление поставок между предприятиями поможет вернуть производству устойчивость. Особое внимание будет уделено наиболее важным производственным цепочкам."

 KCR_edro_track_4:0 "Защитить рабочие места"
 KCR_edro_track_4_desc:0 "Сохранение занятости поможет удержать квалифицированных работников и поддержать покупательную способность населения."

 KCR_edro_track_5:0 "Модернизировать базовые мощности"
 KCR_edro_track_5_desc:0 "Постепенное обновление оборудования повысит эффективность действующих производств без радикальной перестройки экономики."

 KCR_edro_track_6:0 "Укрепить хозяйственную устойчивость"
 KCR_edro_track_6_desc:0 "Резервы и предсказуемое управление позволят Центру лучше переносить перебои в поставках и внешнее давление."

 KCR_edro_track_7:0 "Продолжение проверенного курса"
 KCR_edro_track_7_desc:0 "Проверенная модель доказала свою жизнеспособность. Центр продолжит развивать её, избегая рискованных экспериментов."

 KCR_edro_plan_1:0 "Новый экономический план"
 KCR_edro_plan_1_desc:0 "Правительство подготовит комплексную программу преобразований с чёткими целями и сроками. Государство возьмёт на себя ведущую роль в развитии экономики."

 KCR_edro_plan_2:0 "Государственные инвестиции"
 KCR_edro_plan_2_desc:0 "Бюджетные средства направят в отрасли, имеющие стратегическое значение для самостоятельности Центра."

 KCR_edro_plan_3:0 "Централизованное распределение"
 KCR_edro_plan_3_desc:0 "Распределение дефицитных материалов будет осуществляться по установленным приоритетам, чтобы избежать хаоса и спекуляций."

 KCR_edro_plan_4:0 "Промышленный приоритет"
 KCR_edro_plan_4_desc:0 "Промышленность станет главным получателем ресурсов. В первую очередь будут развиваться производства, необходимые для снабжения района."

 KCR_edro_plan_5:0 "План восстановления инфраструктуры"
 KCR_edro_plan_5_desc:0 "Восстановление дорог, коммунальных сетей и складов создаст основу для дальнейшего роста производства."

 KCR_edro_plan_6:0 "Мобилизационное производство"
 KCR_edro_plan_6_desc:0 "Часть предприятий подготовят к быстрому переходу на выпуск продукции, необходимой в чрезвычайных условиях."

 KCR_edro_plan_7:0 "Утвердить пятилетнюю программу"
 KCR_edro_plan_7_desc:0 "Пятилетняя программа объединит отдельные проекты в единый государственный план и задаст направление развития Центра."

 KCR_edro_trade_1:0 "Торговля — залог сильной экономики"
 KCR_edro_trade_1_desc:0 "Центр сделает ставку на обмен товарами и услугами с соседними районами. Торговля поможет компенсировать нехватку собственных ресурсов."

 KCR_edro_trade_2:0 "Поддержка частной инициативы"
 KCR_edro_trade_2_desc:0 "Упрощение условий для малого бизнеса позволит быстрее восстановить услуги, розничную торговлю и местное производство."

 KCR_edro_trade_3:0 "Торговые соглашения"
 KCR_edro_trade_3_desc:0 "Администрация начнёт переговоры о взаимных поставках и снижении барьеров с соседними территориями."

 KCR_edro_trade_4:0 "Новые рынки сбыта"
 KCR_edro_trade_4_desc:0 "Предприятиям помогут найти покупателей за пределами Центра, чтобы расширить производство и получить дополнительные доходы."

 KCR_edro_trade_5:0 "Развитие логистики"
 KCR_edro_trade_5_desc:0 "Склады, транспортные маршруты и пункты распределения будут приведены в порядок для ускорения товарооборота."

 KCR_edro_trade_6:0 "Привлечение инвесторов"
 KCR_edro_trade_6_desc:0 "Внешним предпринимателям предложат гарантии и выгодные условия для вложений в экономику района."

 KCR_edro_trade_7:0 "Торговый узел Красноярска"
 KCR_edro_trade_7_desc:0 "Центр превратится в важный пункт обмена товарами между районами Красноярска, укрепив своё влияние экономическими методами."

 KCR_edro_army_reform:0 "Реформа вооружённых сил"
 KCR_edro_army_reform_desc:0 "Разрозненные отряды должны превратиться в единую структуру. Реформа определит порядок комплектования, подчинения и снабжения вооружённых сил Центра."

 KCR_edro_unified_command:0 "Единое командование"
 KCR_edro_unified_command_desc:0 "Все подразделения будут подчинены общему командованию. Это устранит конкуренцию между отдельными формированиями и позволит планировать совместные действия."

 KCR_edro_territorial_defence:0 "Территориальная оборона"
 KCR_edro_territorial_defence_desc:0 "В каждом микрорайоне создадут силы территориальной обороны. Они смогут охранять важные объекты и поддерживать порядок в случае кризиса."

 KCR_edro_army_spirit_1:0 "Армейский дух: сплочение"
 KCR_edro_army_spirit_1_desc:0 "Совместная подготовка и единая присяга укрепят чувство принадлежности к одной армии. Первый этап реформы заложит основу военной дисциплины."

 KCR_edro_recruitment:0 "Система комплектования"
 KCR_edro_recruitment_desc:0 "Будет упорядочен набор добровольцев и резервистов. Единые требования позволят повысить качество личного состава."

 KCR_edro_training_centers:0 "Учебные центры"
 KCR_edro_training_centers_desc:0 "На базе доступных объектов откроются центры начальной подготовки. Новобранцы будут проходить единый курс обучения."

 KCR_edro_officer_courses:0 "Курсы младших командиров"
 KCR_edro_officer_courses_desc:0 "Подготовка младшего командного состава поможет закрыть нехватку опытных руководителей на местах."

 KCR_edro_army_spirit_2:0 "Армейский дух: дисциплина"
 KCR_edro_army_spirit_2_desc:0 "Регулярные занятия и единые стандарты службы укрепят дисциплину. Подразделения станут лучше действовать в составе крупных соединений."

 KCR_edro_communications:0 "Связь и координация"
 KCR_edro_communications_desc:0 "Современные средства связи и единые процедуры обмена информацией повысят согласованность действий подразделений."

 KCR_edro_recon_units:0 "Разведывательные подразделения"
 KCR_edro_recon_units_desc:0 "Специализированные группы будут собирать сведения о местности и обстановке. Командование получит более полное представление о возможных угрозах."

 KCR_edro_engineers:0 "Инженерные подразделения"
 KCR_edro_engineers_desc:0 "Инженерные части займутся оборудованием позиций, восстановлением переправ и расчисткой маршрутов. Их работа повысит мобильность армии."

 KCR_edro_army_spirit_3:0 "Армейский дух: слаженность"
 KCR_edro_army_spirit_3_desc:0 "Учения и совместная работа разных родов подразделений сформируют устойчивые армейские связи. Приказы будут исполняться быстрее и точнее."

 KCR_edro_logistics:0 "Военная логистика"
 KCR_edro_logistics_desc:0 "Создание системы складов и снабженческих маршрутов уменьшит перебои с продовольствием, топливом и снаряжением."

 KCR_edro_mobile_reserve:0 "Подвижный резерв"
 KCR_edro_mobile_reserve_desc:0 "Подготовленные резервные подразделения смогут быстро усиливать наиболее уязвимые участки. Командование получит дополнительную гибкость."

 KCR_edro_arsenal:0 "Районный арсенал"
 KCR_edro_arsenal_desc:0 "Учёт, ремонт и распределение вооружения будут сосредоточены в единой системе. Это позволит эффективнее использовать имеющиеся запасы."

 KCR_edro_army_spirit_4:0 "Армейский дух: готовность"
 KCR_edro_army_spirit_4_desc:0 "Улучшенное снабжение и подготовка повысят уверенность личного состава. Армия будет готова к продолжительным операциям."

 KCR_edro_field_exercises:0 "Полевые учения"
 KCR_edro_field_exercises_desc:0 "Крупные учения проверят взаимодействие штабов и подразделений в условиях, приближённых к боевым."

 KCR_edro_operational_staff:0 "Оперативный штаб"
 KCR_edro_operational_staff_desc:0 "Постоянный штаб займётся планированием операций и координацией сил. Решения командования станут более последовательными."

 KCR_edro_mobilization_plan:0 "План мобилизации"
 KCR_edro_mobilization_plan_desc:0 "Будут определены порядок призыва резерва, распределение транспорта и приоритеты снабжения на случай войны."

 KCR_edro_army_spirit_5:0 "Армейский дух: сила Центра"
 KCR_edro_army_spirit_5_desc:0 "Завершение реформы объединит дисциплину, подготовку и снабжение в единую систему. Вооружённые силы станут одним из главных институтов нового государства."

 KCR_edro_social_clinics:0 "Восстановление поликлиник"
 KCR_edro_social_clinics_desc:0 "Медицинские учреждения получат помощь с оборудованием и необходимыми материалами. Доступность базовой медицинской помощи станет одним из приоритетов администрации."

 KCR_edro_social_schools:0 "Поддержка школ"
 KCR_edro_social_schools_desc:0 "Школы и учреждения дополнительного образования должны продолжать работу даже в условиях нестабильности. Администрация займётся ремонтом и обеспечением учебного процесса."

 KCR_edro_social_housing:0 "Жилищная программа"
 KCR_edro_social_housing_desc:0 "Муниципалитет проведёт оценку жилого фонда и определит наиболее срочные задачи по ремонту домов и коммунальных сетей."

 KCR_edro_social_employment:0 "Программа занятости"
 KCR_edro_social_employment_desc:0 "Временные общественные работы и поддержка предприятий помогут вернуть людей к стабильной занятости."

 KCR_edro_social_culture:0 "Культурная жизнь Центра"
 KCR_edro_social_culture_desc:0 "Библиотеки, дома культуры и местные инициативы получат поддержку. Общие культурные пространства укрепят чувство единства жителей."

 KCR_edro_social_contract:0 "Новый общественный договор"
 KCR_edro_social_contract_desc:0 "Власть подтвердит обязательства перед жителями: безопасность, доступные услуги и постепенное улучшение условий жизни. Взамен общество получит возможность участвовать в развитии района."

 KCR_edro_raid_audit:0 "Проверка районных ведомств"
 KCR_edro_raid_audit_desc:0 "Специальные комиссии проверят работу ведомств, чья деятельность вызывает обоснованные подозрения. Цель — выявить злоупотребления и восстановить доверие к администрации."

 KCR_edro_raid_procurement:0 "Ревизия государственных закупок"
 KCR_edro_raid_procurement_desc:0 "Контракты и поставки будут проверены на завышение цен, фиктивных посредников и конфликт интересов. Нарушения передадут на рассмотрение компетентных органов."

 KCR_edro_raid_shadow:0 "Удар по теневым схемам"
 KCR_edro_raid_shadow_desc:0 "Администрация сосредоточится на выявлении нелегальных сборов и коррупционных связей. Прозрачность финансовых потоков должна стать нормой."

 KCR_edro_raid_bureau:0 "Антикоррупционное управление"
 KCR_edro_raid_bureau_desc:0 "Постоянное подразделение получит полномочия координировать проверки и принимать обращения граждан. Борьба с коррупцией станет системной задачей."

 KCR_edro_raid_railway:0 "Разведывательные вылазки в Железнодорожный"
 KCR_edro_raid_railway_desc:0 "Подготовка групп наблюдения позволит собирать сведения о ситуации в Железнодорожном районе. После завершения работы станут доступны специальные решения для вылазок."

 KCR_edro_raid_soviet:0 "Разведывательные вылазки в Советский"
 KCR_edro_raid_soviet_desc:0 "Центр начнёт скрытно изучать обстановку в Советском районе. Полученные сведения помогут оценить его возможности и подготовить дальнейшие действия."

