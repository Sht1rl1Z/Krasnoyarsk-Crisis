l_russian:
 KCR_reggov_emergency_council:0 "Чрезвычайный окружной совет"
 KCR_reggov_emergency_council_desc:0 "Созвать представителей ключевых ведомств и городов. Совет не решит все противоречия, но позволит определить, кто и за что отвечает."
 KCR_reggov_open_register:0 "Открытый реестр обязательств"
 KCR_reggov_open_register_desc:0 "Каждое ведомство публикует расходы, долги и невыполненные обещания. Впервые губернатор получает картину реальных обязательств округа."
 KCR_reggov_public_hearings:0 "Публичные слушания"
 KCR_reggov_public_hearings_desc:0 "Спорные решения выносятся на слушания. Это медленнее закрытых распоряжений, зато снижает риск саботажа на местах."
 KCR_reggov_mandate_choice:0 "Откуда брать мандат?"
 KCR_reggov_mandate_choice_desc:0 "Губернатор должен решить, на чём будет держаться его власть: на прямом общественном одобрении или на соглашении с городскими профессиональными объединениями."
 KCR_reggov_civic_mandate:0 "Голос округа"
 KCR_reggov_civic_mandate_desc:0 "Провести окружной опрос и публично принять его результат. Политическая поддержка становится шире, но губернатор теряет часть свободы манёвра."
 KCR_reggov_industrial_compact:0 "Пакт городских корпораций"
 KCR_reggov_industrial_compact_desc:0 "Заключить соглашение с инженерными палатами, университетами и профессиональными союзами. Они обеспечат экспертизу, но потребуют влияния на решения."
 KCR_reggov_policy_charter:0 "Хартия окружной ответственности"
 KCR_reggov_policy_charter_desc:0 "Закрепить распределение полномочий и срок исполнения реформ. Политическая развилка завершена — теперь можно перейти к долгосрочным проектам и военному планированию."
 KCR_reggov_science_bureau:0 "Бюро прикладных исследований"
 KCR_reggov_science_bureau_desc:0 "Объединить лаборатории, технические кафедры и конструкторские группы вокруг задач округа. Это не мгновенный промышленный рывок, а создание собственной инженерной школы."
 KCR_reggov_closed_plant_conversion:0 "Вторая жизнь закрытых цехов"
 KCR_reggov_closed_plant_conversion_desc:0 "Переоборудовать простаивающие помещения под ремонт оборудования и выпуск комплектующих, вместо строительства завода с нуля."
 KCR_reggov_energy_island:0 "Энергетический резерв"
 KCR_reggov_energy_island_desc:0 "Создать резервные схемы питания для критических предприятий. Цена — расходы на оборудование, выгода — устойчивость при перебоях."
 KCR_reggov_technical_education:0 "Инженерный набор"
 KCR_reggov_technical_education_desc:0 "Поддержать ускоренные курсы для техников, механиков и специалистов связи. Округу нужны не только станки, но и люди, способные их обслуживать."
 KCR_reggov_municipal_bonds:0 "Облигации развития"
 KCR_reggov_municipal_bonds_desc:0 "Привлечь средства жителей и предприятий через целевые облигации. Успех зависит от доверия к губернатору, а не от очередного перераспределения бюджета."
 KCR_reggov_cold_storage:0 "Сеть сезонных складов"
 KCR_reggov_cold_storage_desc:0 "Создать небольшие склады в узловых населённых пунктах, чтобы не зависеть от одного центрального хранилища и сезонных сбоев доставки."
 KCR_reggov_mobility_doctrine:0 "Доктрина короткого плеча"
 KCR_reggov_mobility_doctrine_desc:0 "Отказаться от громоздких планов наступления в пользу небольших мобильных групп, действующих в пределах доступного снабжения."
 KCR_reggov_signal_companies:0 "Роты связи и наблюдения"
 KCR_reggov_signal_companies_desc:0 "Усилить связь между гарнизонами, наладить наблюдение за дорогами и обмен оперативными сводками. Скорость решения теперь зависит от качества информации."
 KCR_reggov_engineer_detachments:0 "Инженерные команды"
 KCR_reggov_engineer_detachments_desc:0 "Подготовить мобильные команды для расчистки дорог, полевого ремонта и быстрого оборудования оборонительных позиций."
 KCR_reggov_volunteer_contract:0 "Контракт добровольца"
 KCR_reggov_volunteer_contract_desc:0 "Ввести ограниченный контракт для специалистов и резервистов. Добровольцев меньше, чем при всеобщем призыве, зато они быстрее осваивают сложные задачи."
 KCR_reggov_territorial_duty:0 "Территориальная повинность"
 KCR_reggov_territorial_duty_desc:0 "Организовать краткие сборы жителей и закрепить их за местными участками. Это расширит резерв, но отвлечёт людей от гражданской работы."
 KCR_reggov_drill_network:0 "Единый цикл подготовки"
 KCR_reggov_drill_network_desc:0 "Утвердить общие нормативы для связи, инженерных команд и подразделений быстрого реагирования."
 KCR_reggov_wartime_industry:0 "Промышленность особого периода"
 KCR_reggov_wartime_industry_desc:0 "Составить перечень мастерских и предприятий, которые можно перевести на срочные оборонные заказы при угрозе войны."
 KCR_reggov_border_survey:0 "Картография советского района"
 KCR_reggov_border_survey_desc:0 "Собрать сведения о переправах, дорогах, узлах связи и местах концентрации сил Советского района. Это разведывательная подготовка, а не объявление войны."
 KCR_reggov_contingency_routes:0 "Запасные маршруты"
 KCR_reggov_contingency_routes_desc:0 "Разработать альтернативные маршруты переброски войск и эвакуации оборудования на случай блокирования основных дорог."
 KCR_reggov_signal_intercepts:0 "Радиоперехват и ложные следы"
 KCR_reggov_signal_intercepts_desc:0 "Создать небольшую службу радионаблюдения и ввести режим дезинформации о передвижениях окружных подразделений."
 KCR_reggov_evacuation_protocol:0 "Протокол эвакуации"
 KCR_reggov_evacuation_protocol_desc:0 "Определить, какие специалисты, архивы и станки должны быть вывезены первыми в случае прорыва границы."
 KCR_reggov_field_command:0 "Полевое командование"
 KCR_reggov_field_command_desc:0 "Проверить на учениях, сможет ли окружное руководство действовать при потере связи с административным центром."
 KCR_reggov_northern_line:0 "План «Северная линия»"
 KCR_reggov_northern_line_desc:0 "Утвердить единый план на случай войны с Советским районом: разведка, мобильные резервы, запасные маршруты и сохранение промышленного ядра."
 KCR_reggov_initial_bureaucracy:0 "Разрыв ведомственных связей"
 KCR_reggov_initial_bureaucracy_desc:0 "Ведомства работают по собственным правилам, а координация между ними отнимает время и ресурсы."
 KCR_reggov_initial_economy:0 "Хрупкая производственная база"
 KCR_reggov_initial_economy_desc:0 "Округ зависит от изношенных мощностей и не имеет достаточного резерва критически важных комплектующих."
 KCR_reggov_initial_army:0 "Гарнизоны без общей картины"
 KCR_reggov_initial_army_desc:0 "Подразделения действуют разрозненно, связь нестабильна, а единые планы на случай кризиса отсутствуют."
 KCR_reggov_party_balance:0 "Политика взаимных блокировок"
 KCR_reggov_party_balance_desc:0 "Несколько групп влияния способны остановить решения друг друга, но ни одна не может управлять округом в одиночку."
 KCR_reggov_regional_mandate:0 "Неопределённый мандат"
 KCR_reggov_regional_mandate_desc:0 "Формальные полномочия губернатора не подкреплены ясным общественным соглашением."
 KCR_reggov_civic_mandate:0 "Общественный мандат"
 KCR_reggov_civic_mandate_desc:0 "Открытая процедура укрепляет доверие, хотя вынуждает власть считаться с общественными ожиданиями."
 KCR_reggov_technocratic_compact:0 "Пакт технических корпораций"
 KCR_reggov_technocratic_compact_desc:0 "Экспертные сообщества помогают решать сложные задачи, получая взамен влияние на приоритеты развития."
 KCR_reggov_applied_science:0 "Бюро прикладных исследований"
 KCR_reggov_applied_science_desc:0 "Научные группы работают над практическими задачами округа и ускоряют освоение технологий."
 KCR_reggov_conversion:0 "Переоборудование закрытых цехов"
 KCR_reggov_conversion_desc:0 "Простаивающие площади возвращены в хозяйственный оборот и выпускают необходимые комплектующие."
 KCR_reggov_energy_reserve:0 "Резервные энергосхемы"
 KCR_reggov_energy_reserve_desc:0 "Критические предприятия лучше защищены от перебоев энергоснабжения."
 KCR_reggov_technical_education:0 "Инженерная школа округа"
 KCR_reggov_technical_education_desc:0 "Подготовка техников повышает способность предприятий осваивать оборудование и поддерживать выпуск."
 KCR_reggov_development_bonds:0 "Облигации развития"
 KCR_reggov_development_bonds_desc:0 "Целевые вложения поддерживают модернизацию, не перекладывая все расходы на текущий бюджет."
 KCR_reggov_distributed_storage:0 "Распределённые склады"
 KCR_reggov_distributed_storage_desc:0 "Запасы размещены в нескольких узлах, что снижает зависимость от единственного центра снабжения."
 KCR_reggov_mobile_doctrine:0 "Доктрина короткого плеча"
 KCR_reggov_mobile_doctrine_desc:0 "Армия делает ставку на мобильность и действия в пределах устойчивого снабжения."
 KCR_reggov_signal_network:0 "Сеть связи и наблюдения"
 KCR_reggov_signal_network_desc:0 "Связь между гарнизонами и обмен сводками позволяют быстрее реагировать на изменения обстановки."
 KCR_reggov_engineer_detachments:0 "Мобильные инженерные команды"
 KCR_reggov_engineer_detachments_desc:0 "Подготовленные команды способны быстро ремонтировать дороги и оборудовать позиции."
 KCR_reggov_volunteer_contract:0 "Контрактная служба специалистов"
 KCR_reggov_volunteer_contract_desc:0 "Небольшое профессиональное ядро быстрее осваивает сложные задачи."
 KCR_reggov_territorial_duty:0 "Территориальная повинность"
 KCR_reggov_territorial_duty_desc:0 "Краткие сборы расширяют резерв, но требуют отвлечения людей от гражданской работы."
 KCR_reggov_training_cycle:0 "Единый цикл подготовки"
 KCR_reggov_training_cycle_desc:0 "Общие нормативы повышают согласованность связи, инженерных частей и мобильных подразделений."
 KCR_reggov_wartime_industry:0 "Промышленность особого периода"
 KCR_reggov_wartime_industry_desc:0 "Определены предприятия, которые смогут быстро перейти на срочные оборонные заказы."
 KCR_reggov_border_survey:0 "Картография Советского района"
 KCR_reggov_border_survey_desc:0 "Собираются сведения о переправах, дорогах, узлах связи и возможных направлениях действий противника."
 KCR_reggov_contingency_routes:0 "Запасные маршруты"
 KCR_reggov_contingency_routes_desc:0 "Подготовлены альтернативные пути переброски войск и эвакуации оборудования."
 KCR_reggov_signal_intercepts:0 "Радиоперехват и дезинформация"
 KCR_reggov_signal_intercepts_desc:0 "Радионаблюдение дополняется мерами, затрудняющими противнику оценку наших перемещений."
 KCR_reggov_evacuation_protocol:0 "Протокол эвакуации"
 KCR_reggov_evacuation_protocol_desc:0 "Установлена очерёдность вывоза специалистов, архивов и критического оборудования."
 KCR_reggov_field_command:0 "Полевое командование"
 KCR_reggov_field_command_desc:0 "Штаб проверил способность действовать при потере связи с административным центром."
 KCR_reggov_northern_line:0 "План «Северная линия»"
 KCR_reggov_northern_line_desc:0 "Разведка, мобильные резервы, запасные маршруты и защита промышленного ядра сведены в единый план."
