 KCR.10.t:0 "The Two-Cabinet Crisis"
 KCR.10.d:0 "The confrontation between the mayor's office and the governor has reached its limit."
 KCR.10.a:0 "Support the mayor's office"
 KCR.11.t:0 "Election Day: The Party Struggle Ends"
 KCR.11.desc:0 "On September 14, 2014, the struggle between the four parties ends. The accumulated decisions determine the winner."
 KCR.11.a:0 "The Governor's Party wins"
 KCR.11.b:0 "The Nationalists win"
 KCR.11.c:0 "Fair Decisions win"
 KCR.11.d:0 "The Proletariat wins"
 KCR.12.t:0 "Who Holds the Power?"
 KCR.12.desc:0 "The winning party has been determined. Now the real question is decided: the mayor's office or the governor?"
 KCR.12.a:0 "The mayor's office takes power"
 KCR.12.b:0 "The governor takes power"
